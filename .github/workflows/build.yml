name: Integrated SukiSU Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 1. 拉取 LineageOS 内核源码
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: kernel_source
          fetch-depth: 1

      # 2. 拉取 Proton-Clang 工具链
      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/shs-sssh/proton-clang.git toolchain/proton-clang
          echo "${GITHUB_WORKSPACE}/toolchain/proton-clang/bin" >> $GITHUB_PATH
      # 3. Integrate SukiSU Ultra
      - name: Integrate SukiSU Ultra
        run: |
          set -euo pipefail
          cd kernel_source
          echo "========================================"
          echo "Installing SukiSU Ultra"
          echo "========================================"
          rm -rf /tmp/SukiSU-Ultra
          git clone --depth=1 -b builtin https://github.com/shs-sssh/SukiSU-Ultra.git /tmp/SukiSU-Ultra
          echo "========================================"
          echo "Cleaning DTS changes"
          echo "========================================"
          git checkout -- arch/arm64/boot/dts/ || true
          bash /tmp/SukiSU-Ultra/kernel/setup.sh
          ls -ld drivers/kernelsu
          readlink -f drivers/kernelsu
          grep -n -C 3 "kernelsu" drivers/Makefile || true
          grep -n -C 3 "kernelsu" drivers/Kconfig || true
          echo "========================================"
          echo "SukiSU Makefile"
          echo "========================================"
          grep -nE '^(obj-|kernelsu-y)' drivers/kernelsu/Makefile
          
      # 4. Integrate SUSFS
      - name: Integrate SUSFS
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"

          echo "========================================"
          echo "Checking SUSFS patch"
          echo "========================================"
          test -f "${GITHUB_WORKSPACE}/kernel_source/5.4.patch"
          ls -lh 5.4.patch

          echo "========================================"
          echo "Applying SUSFS patch"
          echo "========================================"
          patch -p1 -N --ignore-whitespace < 5.4.patch
          
          echo "========================================"
          echo "Verifying SUSFS integration"
          echo "========================================"
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          ls -lh fs/susfs.c include/linux/susfs*.h
          grep -n "susfs.o" fs/Makefile
          grep -n "KSU_SUSFS" drivers/kernelsu/Kconfig | head -30 || true
          grep -Rns "KSU_SUSFS" drivers/kernelsu \
            --include='*.c' \
            --include='*.h' \
            --include='Kconfig' \
            --include='Makefile' | head -50 || true

          echo "========================================"
          echo "SUSFS integration completed successfully"
          echo "========================================"
      # 5. 构建集成内核
      - name: Build Integrated Kernel
        run: |
          set -euo pipefail
          cd kernel_source
          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
          echo "========================================"
          echo "1. 指定一加9 (lahaina-qgki) 配置文件路径"
          echo "========================================"
          DEFCONFIG_FILE="arch/arm64/configs/vendor/lahaina-qgki_defconfig"
          DEFCONFIG_TARGET="vendor/lahaina-qgki_defconfig"
          if [ ! -f "${DEFCONFIG_FILE}" ]; then
            echo "ERROR: 未找到配置文件 ${DEFCONFIG_FILE}！"
            exit 1
          fi
          echo "指定配置文件: ${DEFCONFIG_FILE}"
          echo "========================================"
          echo "2. 注入 SukiSU + SUSFS Config 到 defconfig"
          echo "========================================"
          # 必须先追加到源 defconfig 文件，然后再执行 make
          cat << 'EOF' >> "${DEFCONFIG_FILE}"
          # SukiSU / Security Configurations
          CONFIG_NET=y
          CONFIG_RPS=y
          CONFIG_KSU=y
          CONFIG_KSU_SPOOF_CPU=y
          CONFIG_KSU_SUCOMPAT=y
          CONFIG_KSU_SULOG=y
          # SUSFS
          CONGIG_BOOT_CONFIG=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          # Kernel Security Dependencies
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITYFS=y
          # Disable unnecessary debug/config options
          # CONFIG_IOMMU_DEBUG is not set
          # CONFIG_IOMMU_DEBUGFS is not set
          # CONFIG_MEM_SHARE_QMI_SERVICE is not set
          EOF
          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=-RONOVA
            O="${OUT_DIR}"
          )
          echo "========================================"
          echo "3. 生成包含注入 Config 的最终 .config"
          echo "========================================"
          make "${MAKE_ARGS[@]}" "${DEFCONFIG_TARGET}"
          echo "========================================"
          echo "4. 执行 olddefconfig 与核心配置强校验"
          echo "========================================"
          make "${MAKE_ARGS[@]}" olddefconfig
          echo "========================================"
          echo "5. 校验 SUSFS Config"
          echo "========================================"
          grep -E '^CONFIG_KSU_SUSFS' "${OUT_DIR}/.config" || true
          for CONFIG in \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_SU
          do
            if ! grep -q "^${CONFIG}=y$" "${OUT_DIR}/.config"; then
              echo "❌ ERROR: ${CONFIG} 没有成功开启！"
              exit 1
            fi
          done
          echo "✅ SUCCESS: 所有要求的 SUSFS Config 均已开启！"
          
          # 在 Actions 日志中校验 KSU是否成功开启
          grep -E '^CONFIG_KSU(=|_)' "${OUT_DIR}/.config" || true
          echo "========================================"
          echo "5. Kbuild 准备"
          echo "========================================"
          make "${MAKE_ARGS[@]}" -j1 prepare
          make "${MAKE_ARGS[@]}" -j1 scripts
          
          echo "========================================"
          echo "6. 开启全核并发编译"
          echo "========================================"
          make "${MAKE_ARGS[@]}" -j"$(nproc)"
          
       # 6. 打包 AnyKernel3
      - name: Pack with AnyKernel3
        shell: bash
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"
          git clone --depth=1 https://github.com/shs-sssh/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md *placeholder
          sed -i -E 's/^[[:space:]]*do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(BLOCK|block)=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(IS_SLOT_DEVICE|is_slot_device)=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          echo "========================================"
          echo "提取内核镜像产物"
          echo "========================================"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/dtb" ./
            echo "[+] 已提取 dtb"
          fi
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ./
            echo "[+] 已提取 Image.gz-dtb"
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" ./
            echo "[+] 已提取 Image"
          else
            echo "[-] 致命错误：未找到支持的内核镜像文件！"
            exit 1
          fi
          echo "========================================"
          echo "检查 AnyKernel3 文件"
          echo "========================================"
          test -f anykernel.sh
          ls -lh
          echo "========================================"
          echo "生成可刷入 ZIP"
          echo "========================================"
          cd "${GITHUB_WORKSPACE}/AnyKernel3"
          zip -r9 "${GITHUB_WORKSPACE}/SukiSU-Kernel-OP9.zip" . \
            -x ".git/*"
          echo "========================================"
          echo "ZIP 已生成"
          echo "========================================"
          ls -lh "${GITHUB_WORKSPACE}/SukiSU-Kernel-OP9.zip"
      # 7. 上传真正的 AnyKernel3 ZIP
      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel
          path: SukiSU-Kernel-OP9.zip
          if-no-files-found: error
