name: Integrated SukiSU Ultra + SUSFS (stable sync)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 1. 签出当前仓库：workflow 和所有 patch 文件都放在仓库根目录
      - name: Checkout Patch Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 拉取官方 LineageOS 内核源码
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-23.2
          path: kernel_source
          fetch-depth: 1

      # 3. 拉取官方 Proton-Clang 工具链
      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "${GITHUB_WORKSPACE}/toolchain/proton-clang/bin" >> $GITHUB_PATH

      # 4. 应用 SUSFS + KernelSU hook 内核侧 patch（对 lineage-23.2 当前 HEAD 已验证零 fuzz 干净应用）
      #    必须在下面 "Integrate SukiSU Ultra" 之前打，因为这个 patch 里也改了
      #    drivers/Makefile（插入 obj-$(CONFIG_KSU) += kernelsu/），先打它，
      #    setup.sh 自带的 grep 幂等检查会发现已经存在就跳过，不会重复插入。
      - name: Apply SUSFS kernel-side patch
        run: |
          set -euo pipefail
          cd kernel_source
          echo "========================================"
          echo "Applying SUSFS + KernelSU hook patch"
          echo "========================================"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/full-susfs-5.4-v2-compatible-adapted-hunk-fixed.patch"
          echo "[+] fs/susfs.c / include/linux/susfs*.h 等文件已就位"

      # 4.1 应用 SELinuxFS 5.4 适配补丁（补丁文件位于当前仓库根目录）
      - name: Apply SELinux hide kernel-side patch
        run: |
          set -euo pipefail
          cd kernel_source
          PATCH="${GITHUB_WORKSPACE}/LineageOS-sm8350-selinuxfs-hide-5.4.patch"
          test -f "$PATCH"
          echo "Preflighting SELinuxFS patch against LineageOS lineage-23.2"
          patch --dry-run -p1 --fuzz=0 < "$PATCH"
          patch -p1 --fuzz=0 < "$PATCH"
          echo "[+] SELinuxFS selector patch applied"

      # 5. Integrate SukiSU Ultra（官方仓库，固定提交，和 custom compatibility patch 的基线完全对应）
      - name: Integrate SukiSU Ultra
        run: |
          set -euo pipefail
          cd kernel_source
          echo "========================================"
          echo "Installing SukiSU Ultra (official, pinned commit)"
          echo "========================================"
          rm -rf /tmp/SukiSU-Ultra
          SUKISU_REF="6c284e957feaa9a388a9f1c37dc4ec80d95e434b"

          # 明确从官方 builtin 分支获取集成脚本，避免默认检出 main。
          # 使用完整历史，以便校验并检出与补丁基线一致的固定提交。
          git clone --branch builtin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/SukiSU-Ultra
          if ! git -C /tmp/SukiSU-Ultra merge-base --is-ancestor "$SUKISU_REF" refs/remotes/origin/builtin; then
            echo "ERROR: pinned SukiSU commit is not reachable from official builtin branch: $SUKISU_REF"
            exit 1
          fi
          SUKISU_FULL_REF=$(git -C /tmp/SukiSU-Ultra rev-parse "${SUKISU_REF}^{commit}")
          if [ "$SUKISU_FULL_REF" != "$SUKISU_REF" ]; then
            echo "ERROR: ref did not resolve to the exact requested upstream commit"
            echo "Requested: $SUKISU_REF"
            echo "Resolved:  $SUKISU_FULL_REF"
            exit 1
          fi
          git -C /tmp/SukiSU-Ultra checkout --detach "$SUKISU_FULL_REF"
          SCRIPT_REF=$(git -C /tmp/SukiSU-Ultra rev-parse HEAD)
          if [ "$SCRIPT_REF" != "$SUKISU_FULL_REF" ]; then
            echo "ERROR: setup script repository is not at the pinned builtin commit"
            exit 1
          fi
          echo "Pinned SukiSU builtin full commit: $SUKISU_FULL_REF"

          # 官方 setup.sh 内部的 clone 也未指定分支；明确改为 builtin，
          # 防止它先从 main 建立 KernelSU，再依赖后续 checkout 才回到固定提交。
          sed -i 's#git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU#git clone --branch builtin https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU#' /tmp/SukiSU-Ultra/kernel/setup.sh
          if ! grep -Fq 'git clone --branch builtin https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU' /tmp/SukiSU-Ultra/kernel/setup.sh; then
            echo "ERROR: could not force setup.sh's KernelSU clone to the builtin branch"
            exit 1
          fi

          echo "========================================"
          echo "Cleaning DTS changes"
          echo "========================================"
          git checkout -- arch/arm64/boot/dts/
          # 固定到 6c284e957，和下面的 custom compatibility patch 基线精确对应，不用最新 tag/分支头。
          # setup.sh 内部会创建 kernel_source/KernelSU，因此随后还要验证那个仓库的实际 HEAD。
          bash /tmp/SukiSU-Ultra/kernel/setup.sh "$SUKISU_FULL_REF"
          ACTUAL_SUKISU_REF=$(git -C KernelSU rev-parse HEAD)
          if [ "$ACTUAL_SUKISU_REF" != "$SUKISU_FULL_REF" ]; then
            echo "ERROR: setup.sh did not install the pinned SukiSU builtin commit"
            echo "Expected: $SUKISU_FULL_REF"
            echo "Actual:   $ACTUAL_SUKISU_REF"
            exit 1
          fi
          echo "[+] Integrated exact SukiSU builtin commit: $ACTUAL_SUKISU_REF"
          ls -ld drivers/kernelsu
          readlink -f drivers/kernelsu
          if grep -n -C 3 "kernelsu" drivers/Makefile; then :; fi
          if grep -n -C 3 "kernelsu" drivers/Kconfig; then :; fi

          echo "========================================"
          echo "SukiSU Makefile"
          echo "========================================"
          grep -nE '^(obj-|kernelsu-y)' drivers/kernelsu/Makefile

          echo "========================================"
          echo "Applying custom compatibility patch to SukiSU-Ultra driver source"
          echo "========================================"
          # drivers/kernelsu 指向 KernelSU/kernel；这里回到 KernelSU 仓库根目录，
          # 以 kernel/... 路径应用针对精确提交 6c284e957 的重对齐补丁。
          # 先 dry-run，再以零 fuzz 应用；任何上下文不匹配都直接失败。
          cd KernelSU
          COMPAT_PATCH="${GITHUB_WORKSPACE}/sukisu-builtin-6c284e957-nokpm-nopin-cpu-spoof.patch"
          test -f "$COMPAT_PATCH"
          patch --dry-run -p1 --fuzz=0 < "$COMPAT_PATCH"
          patch -p1 --fuzz=0 < "$COMPAT_PATCH"
          # 把新增源文件纳入 git diff 的 whitespace 校验，但不提交源码。
          git add -N kernel/feature/cpu_spoof.c kernel/feature/cpu_spoof.h
          git diff --check
          echo "[+] CPU-spoof / SUSFS compatibility patch applied cleanly to pinned builtin source"
          if ! grep -Fq 'static int kernel_umount_feature_set(u64 value)' kernel/feature/kernel_umount.c; then
            echo "ERROR: pinned upstream source is missing kernel_umount_feature_set()"
            exit 1
          fi

          # SELinux hide patch is for the SukiSU builtin source layout. Check exact
          # context first; do not force fuzz or silently continue on a baseline mismatch.
          SELINUX_HIDE_PATCH="${GITHUB_WORKSPACE}/SukiSU-Ultra-builtin-selinux-hide-5.4-rebased-after-cpu.patch"
          test -f "$SELINUX_HIDE_PATCH"
          echo "Preflighting SukiSU SELinux hide patch against the integrated KernelSU tree"
          patch --dry-run -p1 --fuzz=0 < "$SELINUX_HIDE_PATCH"
          patch -p1 --fuzz=0 < "$SELINUX_HIDE_PATCH"
          git add -N kernel/feature/selinux_hide.c kernel/feature/selinux_hide.h
          git diff --check
          echo "[+] Rebased SukiSU SELinux hide patch applied cleanly after CPU/SUSFS compatibility patch"
          cd ..

          # SUCOMPAT and SULOG are not Kconfig symbols in the pinned official builtin
          # commit; Kconfig silently drops such unknown CONFIG_ lines. They are built
          # into kernel/ksu.c instead, so verify the actual source inclusion/init path.
          KSU_KERNEL_DIR="${GITHUB_WORKSPACE}/kernel_source/KernelSU/kernel"
          KSU_UNITY="${KSU_KERNEL_DIR}/ksu.c"
          echo "Verifying built-in SUCOMPAT and SULOG source features"
          for src in feature/sucompat.c feature/sucompat.h feature/sulog.c feature/sulog.h; do
            if [ ! -f "${KSU_KERNEL_DIR}/${src}" ]; then
              echo "ERROR: required built-in SukiSU source is missing: ${src}"
              exit 1
            fi
          done
          for marker in \
            '#include "feature/sucompat.c"' \
            '#include "feature/sulog.c"' \
            'ksu_sucompat_init();' \
            'ksu_sulog_init();'; do
            if ! grep -Fq "${marker}" "${KSU_UNITY}"; then
              echo "ERROR: expected built-in SukiSU feature wiring is missing: ${marker}"
              exit 1
            fi
          done
          if ! grep -Fq 'bool ksu_su_compat_enabled __read_mostly = true;' "${KSU_KERNEL_DIR}/feature/sucompat.c"; then
            echo "ERROR: SU compatibility is not enabled by default in the pinned source"
            exit 1
          fi
          echo "[+] SUCOMPAT source is built in and enabled by default"
          echo "[+] SULOG source is built in and registered at initialization (runtime feature defaults off until enabled by manager)"

          echo "Verifying 5.4 SELinux-hide second-stage initialization path"
          SELINUX_RUNTIME="${GITHUB_WORKSPACE}/kernel_source/KernelSU/kernel/runtime/ksud.c"
          if grep -Fq 'ksu_selinux_hide_handle_second_stage();' "${SELINUX_RUNTIME}"; then
            STAGE_CALLS=$(grep -Fc 'ksu_selinux_hide_handle_second_stage();' "${SELINUX_RUNTIME}")
          else
            STAGE_CALLS=0
          fi
          if [ "${STAGE_CALLS}" -lt 2 ]; then
            echo "ERROR: expected both second-stage call sites in ${SELINUX_RUNTIME}; found ${STAGE_CALLS}"
            exit 1
          fi
          if grep -B3 'ksu_selinux_hide_handle_second_stage();' "${SELINUX_RUNTIME}" | grep -q 'KERNEL_VERSION(5, 10, 0)'; then
            echo "ERROR: second-stage SELinux-hide initialization is still version-gated away on Linux 5.4"
            exit 1
          fi
          echo "[+] 5.4 second-stage callback present and not gated out"

      # 6. 构建集成内核
      - name: Build Integrated Kernel
        run: |
          set -euo pipefail
          cd kernel_source
          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          echo "========================================"
          echo "1. 指定一加9 (lahaina-qgki) 配置文件路径"
          echo "========================================"
          DEFCONFIG_FILE="arch/arm64/configs/vendor/lahaina-qgki_defconfig"
          DEFCONFIG_TARGET="vendor/lahaina-qgki_defconfig"

          if [ ! -f "${DEFCONFIG_FILE}" ]; then
            echo "ERROR: 未找到配置文件 ${DEFCONFIG_FILE}！"
            exit 1
          fi
          echo "指定配置文件: ${DEFCONFIG_FILE}"

          echo "========================================"
          echo "2. 注入 SukiSU + SUSFS 及其核心依赖 Config 到 defconfig"
          echo "========================================"
          # 必须先追加到源 defconfig 文件，然后再执行 make
          cat << 'EOF' >> "${DEFCONFIG_FILE}"

          # SukiSU / Security Configurations
          CONFIG_NET=y
          CONFIG_RPS=y
          CONFIG_KSU=y
          # 注意：在固定的官方 builtin 提交 6c284e957 中，SUCOMPAT/SULOG 是
          # ksu.c 无条件编入的源码功能，不是 Kconfig 配置项；不要注入不存在的符号。
          # SUSFS：启用当前源码/补丁树提供的功能开关。
          # 以下两个历史兼容项只有在本次 SUSFS patch 定义它们时才可能生效；后面会单独校验。
          # OPEN_REDIRECT 在 bugfix patch 中依赖 BROKEN，故有意保持关闭。
          CONFIG_BOOT_CONFIG=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SPOOF_CPU=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITYFS=y
          # CPU Spoof: required for resolving kernel data symbols
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          # CONFIG_IOMMU_DEBUG is not set
          # CONFIG_IOMMU_DEBUGFS is not set
          # CONFIG_MEM_SHARE_QMI_SERVICE is not set
          EOF

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=-RONOVA
            O="${OUT_DIR}"
          )

          echo "========================================"
          echo "3. 生成包含注入 Config 的最终 .config"
          echo "========================================"
          make "${MAKE_ARGS[@]}" "${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "4. 执行 olddefconfig 与核心配置强校验"
          echo "========================================"
          make "${MAKE_ARGS[@]}" olddefconfig
          
          echo "========================================"
          echo "验证 CPU Spoof 所需的 Kallsyms 配置"
          echo "========================================"

          for CONFIG in \
            CONFIG_DEBUG_KERNEL \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL
          do
            if ! grep -q "^${CONFIG}=y$" "${OUT_DIR}/.config"; then
              echo "ERROR: ${CONFIG} 未在最终 .config 中启用！"
              if grep -E '^(CONFIG_DEBUG_KERNEL|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL)=|^# CONFIG_(DEBUG_KERNEL|KALLSYMS|KALLSYMS_ALL) is not set' "${OUT_DIR}/.config"; then :; fi
              exit 1
            fi
          done

          grep -E '^CONFIG_(DEBUG_KERNEL|KALLSYMS|KALLSYMS_ALL)=y$' \
            "${OUT_DIR}/.config"
          echo "SUCCESS: CPU Spoof 所需的 Kallsyms 配置已启用。"

          # 校验 KSU / SUSFS 功能位；不能只检查总开关，否则子功能被 olddefconfig 丢弃时仍会误报成功。
          if grep -E '^CONFIG_KSU(=|_)' "${OUT_DIR}/.config"; then :; fi
          REQUIRED_KSU_CONFIGS=(
            CONFIG_KSU
            CONFIG_KSU_SPOOF_CPU
            CONFIG_KSU_FEATURE_ADBROOT
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          )
          for cfg in "${REQUIRED_KSU_CONFIGS[@]}"; do
            if ! grep -qx "${cfg}=y" "${OUT_DIR}/.config"; then
              echo "❌ ERROR: ${cfg} is not enabled after olddefconfig; refusing to build a silently degraded kernel."
              exit 1
            fi
            echo "✅ ${cfg}=y"
          done
          # Older SUSFS patch sets define these two optional symbols, but the pinned SukiSU Kconfig may not.
          # Distinguish "defined but disabled" from "not provided by this patch tree".
          for cfg in CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT CONFIG_KSU_SUSFS_TRY_UMOUNT; do
            if grep -Fqx "${cfg}=y" "${OUT_DIR}/.config"; then
              echo "✅ ${cfg}=y"
            elif grep -Fqx "# ${cfg} is not set" "${OUT_DIR}/.config"; then
              echo "❌ ERROR: ${cfg} exists but is disabled after olddefconfig."
              exit 1
            else
              echo "⚠️ ${cfg} is not defined by the active Kconfig tree; this build cannot enable it as a config option."
            fi
          done
          if grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "${OUT_DIR}/.config"; then
            echo "❌ ERROR: OPEN_REDIRECT should remain disabled while its Kconfig dependency is BROKEN."
            exit 1
          fi
          echo "ℹ️ CONFIG_KSU_SUSFS_OPEN_REDIRECT stays disabled intentionally (depends on BROKEN)."
          # 校验 KSU_DISABLE_MANAGER 是否【处于关闭状态】
          if grep -q '^CONFIG_KSU_DISABLE_MANAGER=y' "${OUT_DIR}/.config"; then
              echo "❌ ERROR: CONFIG_KSU_DISABLE_MANAGER 被开启了（管理器被禁用了）！"
              exit 1
          else
              echo "✅ SUCCESS: CONFIG_KSU_DISABLE_MANAGER 未开启，管理器已保证启用！"
          fi

          echo "========================================"
          echo "5. Kbuild 准备"
          echo "========================================"
          make "${MAKE_ARGS[@]}" -j1 prepare
          make "${MAKE_ARGS[@]}" -j1 scripts

          echo "========================================"
          echo "6. 开启全核并发编译"
          echo "========================================"

          make "${MAKE_ARGS[@]}" -j"$(nproc)"

       # 7. 打包 AnyKernel3
      - name: Pack with AnyKernel3
        shell: bash
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"
          git clone --depth=1 https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md *placeholder
          sed -i -E 's/^[[:space:]]*do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(BLOCK|block)=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(IS_SLOT_DEVICE|is_slot_device)=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          echo "========================================"
          echo "提取内核镜像产物"
          echo "========================================"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/dtb" ./
            echo "[+] 已提取 dtb"
          fi
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ./
            echo "[+] 已提取 Image.gz-dtb"
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" ./
            echo "[+] 已提取 Image"
          else
            echo "[-] 致命错误：未找到支持的内核镜像文件！"
            exit 1
          fi
          echo "========================================"
          echo "检查 AnyKernel3 文件"
          echo "========================================"
          test -f anykernel.sh
          ls -lh
          echo "========================================"
          echo "生成可刷入 ZIP"
          echo "========================================"
          cd "${GITHUB_WORKSPACE}/AnyKernel3"
          zip -r9 "${GITHUB_WORKSPACE}/SukiSU-SUSFS-Kernel-OP9-STABLE.zip" . \
            -x ".git/*"
          echo "========================================"
          echo "ZIP 已生成"
          echo "========================================"
          ls -lh "${GITHUB_WORKSPACE}/SukiSU-SUSFS-Kernel-OP9-STABLE.zip"

      # 8. 上传真正的 AnyKernel3 ZIP
      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-SUSFS-Kernel-STABLE
          path: SukiSU-SUSFS-Kernel-OP9-STABLE.zip
          if-no-files-found: error
