name: Full Kernel Baseline Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      KERNEL_REPO: ${{ github.repository }}
      KERNEL_REF: lineage-23.2
      SUKISU_REPO: https://github.com/shs-sssh/SukiSU-Ultra.git
      SUKISU_REF: builtin-new
      SUSFS_REPO: https://github.com/shs-sssh/susfs4ksu.git
      SUSFS_REF: kernel-5.4

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_REF }}
          path: kernel_source
          fetch-depth: 1

      - name: Checkout exact SukiSU source
        uses: actions/checkout@v4
        with:
          repository: shs-sssh/SukiSU-Ultra
          ref: ${{ env.SUKISU_REF }}
          path: SukiSU-Ultra
          fetch-depth: 1

      - name: Integrate SukiSU
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_source"
          bash "$GITHUB_WORKSPACE/SukiSU-Ultra/kernel/setup.sh"

      - name: Capture complete source tree and metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          mkdir -p baseline/metadata baseline/susfs-fork

          # Record the exact source revisions used for this snapshot.
          {
            echo "kernel_repo=$KERNEL_REPO"
            echo "kernel_requested_ref=$KERNEL_REF"
            echo "kernel_commit=$(git -C kernel_source rev-parse HEAD)"
            echo "sukisu_repo=$SUKISU_REPO"
            echo "sukisu_requested_ref=$SUKISU_REF"
            echo "sukisu_commit=$(git -C SukiSU-Ultra rev-parse HEAD)"
            echo "susfs_repo=$SUSFS_REPO"
            echo "susfs_requested_ref=$SUSFS_REF"
            echo "snapshot_stage=after SukiSU setup"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > baseline/metadata/versions.txt

          git -C kernel_source status --short \
            > baseline/metadata/kernel-git-status.txt
          git -C SukiSU-Ultra status --short \
            > baseline/metadata/sukisu-git-status.txt

          # Save the SukiSU source used in the snapshot.
          cp -a SukiSU-Ultra baseline/SukiSU-Ultra

          # Save the SUSFS fork revision and its patch/source files.
          git clone --depth=1 --branch "$SUSFS_REF" \
            "$SUSFS_REPO" baseline/susfs-fork/repository
          git -C baseline/susfs-fork/repository rev-parse HEAD \
            > baseline/susfs-fork/commit.txt

          # Save the FULL kernel source tree after SukiSU setup.
          # Exclude Git internals and common build outputs to reduce size.
          tar -czf baseline/full-kernel-source.tar.gz \
            --exclude='./.git' \
            --exclude='./out' \
            --exclude='./output' \
            --exclude='./.repo' \
            -C kernel_source .

          # Save metadata and SukiSU source separately.
          tar -czf baseline/metadata-and-sukisu.tar.gz \
            baseline/metadata \
            baseline/SukiSU-Ultra \
            baseline/susfs-fork

          (
            cd baseline
            sha256sum full-kernel-source.tar.gz \
              metadata-and-sukisu.tar.gz > SHA256SUMS
          )

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-kernel-baseline
          path: |
            baseline/full-kernel-source.tar.gz
            baseline/metadata-and-sukisu.tar.gz
            baseline/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
