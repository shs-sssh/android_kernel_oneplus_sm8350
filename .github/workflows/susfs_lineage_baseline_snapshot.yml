name: SUSFS Lineage Baseline Snapshot

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Lineage kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: kernel_source
          fetch-depth: 1

      - name: Integrate the same SukiSU builtin revision used by the build
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"
          git checkout -- arch/arm64/boot/dts/ || true
          rm -rf /tmp/SukiSU-Ultra
          git clone --depth=1 -b builtin https://github.com/shs-sssh/SukiSU-Ultra.git /tmp/SukiSU-Ultra
          bash /tmp/SukiSU-Ultra/kernel/setup.sh
          {
            echo "kernel_commit=$(git rev-parse HEAD)"
            echo "sukisu_commit=$(git -C /tmp/SukiSU-Ultra rev-parse HEAD)"
            echo "sukisu_branch=builtin"
          } > "${GITHUB_WORKSPACE}/snapshot-versions.txt"
          git status --short > "${GITHUB_WORKSPACE}/snapshot-git-status.txt"

      - name: Export exact patch-target files and SUSFS fork files
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"
          SNAP="${GITHUB_WORKSPACE}/susfs-lineage-baseline"
          mkdir -p "${SNAP}/kernel" "${SNAP}/susfs-fork"
          : > "${SNAP}/missing-kernel-files.txt"

          files=(
            fs/Makefile
            fs/namei.c
            fs/namespace.c
            fs/notify/fdinfo.c
            fs/open.c
            fs/proc/base.c
            fs/proc/bootconfig.c
            fs/proc/cmdline.c
            fs/proc/fd.c
            fs/proc/task_mmu.c
            fs/proc_namespace.c
            fs/readdir.c
            fs/stat.c
            fs/statfs.c
            fs/super.c
            kernel/kallsyms.c
            kernel/reboot.c
            kernel/sys.c
            mm/memory.c
            security/selinux/avc.c
            drivers/input/input.c
            fs/exec.c
            fs/dcache.c
            include/linux/mount.h
            include/linux/stat.h
            include/linux/susfs.h
            include/linux/susfs_def.h
            fs/susfs.c
          )

          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "${SNAP}/kernel/$(dirname "$f")"
              cp -a "$f" "${SNAP}/kernel/$f"
            else
              echo "$f" >> "${SNAP}/missing-kernel-files.txt"
            fi
          done

          # Keep the user's existing SUSFS fork source available for direct comparison.
          rm -rf /tmp/susfs4ksu
          git clone --depth=1 -b kernel-5.4 https://github.com/shs-sssh/susfs4ksu.git /tmp/susfs4ksu
          git -C /tmp/susfs4ksu rev-parse HEAD > "${SNAP}/susfs-fork/commit.txt"
          for f in kernel_patches/fs/susfs.c kernel_patches/include/linux/susfs.h kernel_patches/include/linux/susfs_def.h kernel_patches/50_add_susfs_in_kernel-5.4.patch; do
            if [ -f "/tmp/susfs4ksu/$f" ]; then
              mkdir -p "${SNAP}/susfs-fork/$(dirname "$f")"
              cp -a "/tmp/susfs4ksu/$f" "${SNAP}/susfs-fork/$f"
            fi
          done

          cp "${GITHUB_WORKSPACE}/snapshot-versions.txt" "${SNAP}/versions.txt"
          cp "${GITHUB_WORKSPACE}/snapshot-git-status.txt" "${SNAP}/git-status-after-sukisu-setup.txt"
          {
            echo "This is a source snapshot only; no kernel compile was run."
            echo "The kernel files are captured AFTER SukiSU setup.sh and BEFORE applying SUSFS."
            echo "The susfs-fork directory contains the exact files from the kernel-5.4 branch cloned by the original workflow."
          } > "${SNAP}/README.txt"
          tar -czf "${GITHUB_WORKSPACE}/susfs-lineage-baseline.tar.gz" -C "${GITHUB_WORKSPACE}" susfs-lineage-baseline
          sha256sum "${GITHUB_WORKSPACE}/susfs-lineage-baseline.tar.gz" > "${GITHUB_WORKSPACE}/susfs-lineage-baseline.sha256"

      - name: Upload baseline snapshot
        uses: actions/upload-artifact@v4
        with:
          name: susfs-lineage-baseline
          path: |
            susfs-lineage-baseline.tar.gz
            susfs-lineage-baseline.sha256
          if-no-files-found: error
